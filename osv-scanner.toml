# Suppressions for advisories that cannot currently be fixed by upgrading.
# Every entry states why the fix is unavailable, not merely that it is wanted,
# and carries a re-review date. Anything fixable is fixed instead — the fast-uri
# and nanoid exceptions that used to live here are gone because each fix aged
# past the .npmrc `min-release-age=7` cooldown and is now pinned in
# package.json's overrides, as are basic-ftp, brace-expansion, dompurify,
# ip-address and moment (2026-10-02).

# react-router 6.30.4 is pinned transitively by @grafana/ui@13.1.3 (via
# react-router-dom-v5-compat, which requires react-router 6.x). Both advisories
# are fixed only in react-router 7.18.0 (affected ranges ">= 6.0.0, < 7.18.0"
# and ">= 6.4.0, < 7.18.0"; no 6.x backport) — a major that @grafana/ui's v6
# usage cannot take — so this is not upgradable from here. Re-reviewed
# 2026-10-02: the latest @grafana/ui (13.2.3) still requires
# react-router-dom-v5-compat ^6.26.1, which resolves react-router 6.30.6, also
# affected. @grafana/ui is externalized by Grafana at runtime and is not bundled
# into the shipped plugin. Remediation belongs to @grafana/ui; drop these two
# entries when it ships a fixed react-router. ignoreUntil is a re-review date,
# not an expected fix date.
[[IgnoredVulns]]
id = "GHSA-337j-9hxr-rhxg"
ignoreUntil = 2026-11-02
reason = "react-router 6.x pinned transitively by @grafana/ui (13.1.3 here, 13.2.3 latest); fix is v7-only (incompatible). Externalized at runtime, not shipped. Re-review when @grafana/ui updates."
[[IgnoredVulns]]
id = "GHSA-wrjc-x8rr-h8h6"
ignoreUntil = 2026-11-02
reason = "react-router 6.x pinned transitively by @grafana/ui (13.1.3 here, 13.2.3 latest); fix is v7-only (incompatible). Externalized at runtime, not shipped. Re-review when @grafana/ui updates."

# serialize-javascript < 7.1.3: a value holding </script> is serialized
# unescaped, so inlined into a page it can run script (GHSA-m5mm-p8h7-m29v). The
# fix, 7.1.3, was published 2026-10-22 at 21:24 UTC, inside .npmrc's
# min-release-age=7 cooldown until 2026-10-29 at 21:24 UTC. It is a development
# dependency only (copy-webpack-plugin, which serializes the build's own
# options) and is not in the shipped plugin. On 2026-10-30, pin 7.1.3 in
# package.json's overrides and drop this entry; the ignore lapses that day.
[[IgnoredVulns]]
id = "GHSA-m5mm-p8h7-m29v"
ignoreUntil = 2026-10-30
reason = "serialize-javascript 7.1.3 (the fix) was published 2026-10-22T21:24Z, inside .npmrc min-release-age=7 until 2026-10-29T21:24Z; dev-only via copy-webpack-plugin, not shipped. Pin 7.1.3 in overrides on 2026-10-30."
