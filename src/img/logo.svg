<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" role="img" aria-label="NetBox">
  <defs>
    <linearGradient id="nb" x1="0" y1="0" x2="80" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#00d9be"/>
      <stop offset="1" stop-color="#0095a8"/>
    </linearGradient>
  </defs>
  <rect x="3" y="3" width="74" height="74" rx="16" fill="#0b1b22"/>
  <rect x="3.75" y="3.75" width="72.5" height="72.5" rx="15.25" fill="none" stroke="url(#nb)" stroke-width="1.5" opacity="0.6"/>
  <!-- topology: three connected nodes -->
  <g stroke="url(#nb)" stroke-width="3.2" stroke-linecap="round" fill="none">
    <line x1="24" y1="52" x2="40" y2="28"/>
    <line x1="56" y1="52" x2="40" y2="28"/>
    <line x1="24" y1="52" x2="56" y2="52"/>
  </g>
  <g fill="url(#nb)">
    <circle cx="40" cy="26" r="8"/>
    <circle cx="23" cy="54" r="8"/>
    <circle cx="57" cy="54" r="8"/>
  </g>
  <g fill="#0b1b22">
    <circle cx="40" cy="26" r="3"/>
    <circle cx="23" cy="54" r="3"/>
    <circle cx="57" cy="54" r="3"/>
  </g>
</svg>
