apiVersion: 1
groups:
  - orgId: 1
    name: netbox-alerting-enriched
    folder: NetBox
    interval: 1m
    rules:
      - uid: netbox-alert-enriched
        title: NetBox offline devices (enriched)
        # Query A uses alertTable: string columns (name/site/role/tenant)
        # become alert-instance labels; the numeric "value" column is a
        # constant 1 per matching row, thresholded > 0 — one alert instance
        # per offline device, carrying its NetBox context as labels.
        condition: C
        # Pending period and missing-series hold (see docs/ALERTING.md,
        # "Pending period and flap damping"): for equal to the 1m interval
        # means a device must be offline on two consecutive evaluations before
        # it pages (the first starts Pending, the second fires). A device that
        # stops being offline does not evaluate to false here -- the status
        # filter removes its ROW, so Grafana sees a missing series and, by
        # default, resolves it after two missing evaluations; keep_firing_for
        # never applies to a row that is gone (measured). The hold for a
        # filter-shaped rule is missing_series_evals_to_resolve. It is a COUNT
        # of missing evaluations, not a duration: six here, and because a
        # recovery can land just before an evaluation, six guarantees at least
        # five minutes of hold at the 1m interval (five would only guarantee
        # four). So a device toggled back within ~five minutes does not resolve
        # and page again. Spelling: this key is snake_case in a provisioning
        # file and camelCase (missingSeriesEvalsToResolve) on the HTTP API --
        # the reverse of keepFiringFor / keep_firing_for. The wrong one is
        # dropped silently.
        for: 1m
        missing_series_evals_to_resolve: 6
        noDataState: OK
        execErrState: Error
        annotations:
          summary: >-
            Device {{ $labels.name }} ({{ $labels.role }}) at
            {{ $labels.site }} is offline.
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: netboxlabs-netbox-alerting
            model:
              refId: A
              datasource:
                type: grafana-netboxlabs-datasource
                uid: netboxlabs-netbox-alerting
              queryType: objects
              objectType: dcim/devices
              alertTable: true
              filters:
                - field: status
                  operator: ''
                  value: offline
              fields: [name, site, role, tenant]
              limit: 500
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
