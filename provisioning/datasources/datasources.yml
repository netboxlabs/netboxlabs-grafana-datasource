apiVersion: 1

datasources:
  - name: NetBox
    type: netboxlabs-datasource
    uid: netboxlabs-netbox-alerting
    access: proxy
    isDefault: false
    orgId: 1
    version: 1
    editable: true
    jsonData:
      # Base URL of the NetBox instance (no trailing /api). Interpolated from
      # the NETBOX_URL environment variable.
      url: ${NETBOX_URL}
      # Browser-facing NetBox base for deep links, when the URL above is an
      # internal address (compose/k8s DNS). Empty = links pass through verbatim.
      publicUrl: ${NETBOX_PUBLIC_URL}
      tlsSkipVerify: false
      timeoutSeconds: 30
    secureJsonData:
      # NetBox API token (v1 40-char, or v2 "nbt_…"). From NETBOX_API_TOKEN.
      apiToken: ${NETBOX_API_TOKEN}

  # Prometheus + Loki back the demo stack's telemetry panels (service names on
  # the demo compose network). In the plain dev stack these services don't run,
  # so the datasources are present but dormant — harmless unless queried.
  - name: Prometheus
    type: prometheus
    uid: prometheus
    access: proxy
    isDefault: false
    url: http://prometheus:9090
    # Correlations add Explore drill-downs from telemetry into NetBox queries
    # (they render in Explore table/logs views, not on dashboard panels).
    # $$ escapes provisioning-time env interpolation: Grafana must receive the
    # literal ${device}/${src_ip}/${dst_ip}, resolved per clicked row.
    correlations:
      - targetUID: netboxlabs-netbox-alerting
        label: 'NetBox: device details'
        description: Open the NetBox inventory row for this device
        type: query
        config:
          field: device
          target:
            queryType: objects
            objectType: dcim/devices
            filters:
              - field: name
                operator: ''
                value: $${device}
            limit: 10
      - targetUID: netboxlabs-netbox-alerting
        label: 'NetBox: source IP context'
        description: Longest-prefix match the source IP against NetBox IPAM
        type: query
        config:
          field: src_ip
          target:
            queryType: ip-enrichment
            ips: $${src_ip}
      - targetUID: netboxlabs-netbox-alerting
        label: 'NetBox: destination IP context'
        description: Longest-prefix match the destination IP against NetBox IPAM
        type: query
        config:
          field: dst_ip
          target:
            queryType: ip-enrichment
            ips: $${dst_ip}

  - name: Loki
    type: loki
    uid: loki
    access: proxy
    isDefault: false
    url: http://loki:3100
    correlations:
      - targetUID: netboxlabs-netbox-alerting
        label: 'NetBox: device details'
        description: Open the NetBox inventory row for the host emitting this log line
        type: query
        config:
          # Loki log frames carry stream labels in the "labels" field — a JSON
          # object Grafana stringifies before applying the regex (raw JS
          # pattern, no slashes). Extract the host label into ${host}.
          field: labels
          transformations:
            - type: regex
              field: labels
              expression: '"host":\s*"([^"]+)"'
              mapValue: host
          target:
            queryType: objects
            objectType: dcim/devices
            filters:
              - field: name
                operator: ''
                value: $${host}
            limit: 10
