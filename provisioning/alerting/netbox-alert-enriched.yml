apiVersion: 1
groups:
  - orgId: 1
    name: netbox-alerting-enriched
    folder: NetBox
    interval: 1m
    rules:
      - uid: netbox-alert-enriched
        title: NetBox offline devices (enriched)
        # Query A uses alertTable: string columns (name/site/role/tenant)
        # become alert-instance labels; the numeric "value" column is a
        # constant 1 per matching row, thresholded > 0 — one alert instance
        # per offline device, carrying its NetBox context as labels.
        condition: C
        # Pending period and keep-firing (see docs/ALERTING.md, "Pending period
        # and flap damping"): for equal to the 1m interval means a device must
        # be offline on two consecutive evaluations before it pages (the first
        # starts Pending, the second fires), and it stays paged for five
        # minutes after it last matched, so a status that toggles does not
        # resolve and page again on every flip. NetBox status is a step
        # function, so the pending period is one interval; the keep-firing is
        # what absorbs a toggle. Note the spelling: the file provisioner takes
        # keepFiringFor, the HTTP provisioning API keep_firing_for.
        for: 1m
        keepFiringFor: 5m
        noDataState: OK
        execErrState: Error
        annotations:
          summary: >-
            Device {{ $labels.name }} ({{ $labels.role }}) at
            {{ $labels.site }} is offline.
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: netboxlabs-netbox-alerting
            model:
              refId: A
              datasource:
                type: netboxlabs-datasource
                uid: netboxlabs-netbox-alerting
              queryType: objects
              objectType: dcim/devices
              alertTable: true
              filters:
                - field: status
                  operator: ''
                  value: offline
              fields: [name, site, role, tenant]
              limit: 500
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
