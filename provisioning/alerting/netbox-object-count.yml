apiVersion: 1
groups:
  - orgId: 1
    name: netbox-alerting-smoke
    folder: NetBox
    interval: 1m
    rules:
      - uid: netbox-object-count
        title: NetBox device count
        # Query A returns a single-value numeric "count" frame (queryType=objects
        # with count:true). Grafana's server-side expressions cannot reduce the
        # plain table frame ("input data must be a wide series but got type long"),
        # so the datasource returns the row count as a number that Threshold can
        # evaluate directly — no Reduce node needed.
        condition: C
        # A count of NetBox state changes only when someone edits NetBox, so
        # one extra evaluation is enough to ride out an edit in progress (a
        # device deleted and re-added, a bulk import mid-way). A count-only
        # query always returns its one number, zero included, so when the
        # condition clears this instance is evaluated to false rather than
        # lost -- which is why keep-firing (not the missing-series setting
        # the offline-devices rule needs) is the hold here: a count that dips
        # and recovers within five minutes pages once. See docs/ALERTING.md,
        # "Pending period and flap damping".
        for: 1m
        keepFiringFor: 5m
        noDataState: NoData
        execErrState: Error
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: netboxlabs-netbox-alerting
            model:
              refId: A
              datasource:
                type: netboxlabs-datasource
                uid: netboxlabs-netbox-alerting
              queryType: objects
              objectType: dcim/devices
              count: true
              filters: []
              fields: []
              limit: 100
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              conditions:
                - evaluator:
                    type: lt
                    params: [1]
