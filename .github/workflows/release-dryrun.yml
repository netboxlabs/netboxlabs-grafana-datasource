# TEMPORARY: proves the inlined release steps on this PR without a tag, a token
# or a release. Delete before merging.
name: Release dry run

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  dryrun:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Build and package the plugin (unsigned)
        id: package
        uses: grafana/plugin-actions/package-plugin@613a0361142648e6fecfd5f5719e5a283e7faf52 # same pin as release.yml
        with:
          go-version: '1.26'
          node-version: '22'

      - name: Check the outputs the release steps use
        env:
          PLUGIN_VERSION: ${{ steps.package.outputs.plugin-version }}
          ARCHIVE: ${{ steps.package.outputs.archive }}
          ARCHIVE_SHA1: ${{ steps.package.outputs.archive-sha1sum }}
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "version=${PLUGIN_VERSION} archive=${ARCHIVE} sha1=${ARCHIVE_SHA1}"
          test "v${PLUGIN_VERSION}" = "v$(jq -r .version package.json)"
          ls -la "$ARCHIVE" "$ARCHIVE_SHA1"
          awk '/^## / {s++} s == 1 {print}' CHANGELOG.md > release_notes.md
          head -3 release_notes.md
          gh release view "v${PLUGIN_VERSION}" --repo "$GITHUB_REPOSITORY" --json tagName,isDraft
