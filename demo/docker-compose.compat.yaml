# Ephemeral NetBox-version compatibility harness — used by compat-check.sh.
#   NETBOX_IMAGE=netboxcommunity/netbox:v4.6.4-5.0.1 \
#     docker compose -f demo/docker-compose.compat.yaml up -d
# NetBox on :8001, Grafana on :3002 (demo=8000/3001, dev=3000 stay usable).
name: netbox-compat

services:
  postgres:
    image: postgres:16-alpine
    environment: {POSTGRES_DB: netbox, POSTGRES_USER: netbox, POSTGRES_PASSWORD: netbox}
    healthcheck: {test: ['CMD-SHELL', 'pg_isready -U netbox'], interval: 5s, timeout: 5s, retries: 20}

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass redis
    healthcheck: {test: ['CMD', 'redis-cli', '-a', 'redis', 'ping'], interval: 5s, timeout: 5s, retries: 20}

  redis-cache:
    image: redis:7-alpine
    command: redis-server --requirepass redis
    healthcheck: {test: ['CMD', 'redis-cli', '-a', 'redis', 'ping'], interval: 5s, timeout: 5s, retries: 20}

  netbox:
    image: ${NETBOX_IMAGE:?set NETBOX_IMAGE (e.g. netboxcommunity/netbox:v4.6.4-5.0.1)}
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      redis-cache: {condition: service_healthy}
    environment:
      SECRET_KEY: compatcompatcompatcompatcompatcompatcompatcompatcompat
      ALLOWED_HOSTS: '*'
      DB_HOST: postgres
      DB_NAME: netbox
      DB_USER: netbox
      DB_PASSWORD: netbox
      REDIS_HOST: redis
      REDIS_PASSWORD: redis
      REDIS_DATABASE: '0'
      REDIS_CACHE_HOST: redis-cache
      REDIS_CACHE_PASSWORD: redis
      REDIS_CACHE_DATABASE: '1'
      SKIP_SUPERUSER: 'false'
      SUPERUSER_NAME: admin
      SUPERUSER_EMAIL: admin@example.com
      SUPERUSER_PASSWORD: admin
      # NetBox 4.5+ refuses to create ANY token without a configured pepper;
      # earlier configuration generations ignore this env var. compat-check.sh
      # authenticates by provisioning its own token with the credentials above.
      API_TOKEN_PEPPER_1: compatpeppercompatpeppercompatpeppercompatpepper12
    ports: ['8001:8080']

  grafana:
    image: grafana/grafana:13.0.2
    depends_on: [netbox]
    environment:
      # compat-check.sh provisions the token first, then starts this service.
      NETBOX_URL: http://netbox:8080
      NETBOX_API_TOKEN: ${NB_CLIENT_TOKEN:-}
      NETBOX_PUBLIC_URL: ''
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: 'true'
      GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS: netboxlabs-netbox-datasource
    volumes:
      - ../dist:/var/lib/grafana/plugins/netboxlabs-datasource
      - ../provisioning:/etc/grafana/provisioning
    ports: ['3002:3000']
